# .github/workflows/land-on-evidence.yml
#
# Lands a pull request on main when signed evidence says its tests passed on its head, and no
# change to the same module landed since its base. No merge queue, no test run.
#
# Trigger: the push itself. Opened / synchronize / ready_for_review / reopened. A draft is "not
# ready": its land-on-evidence check goes red. The agent's order is test under cilock -> publish
# evidence -> push, so the evidence exists when this fires.
#
# pull_request_target runs THIS file from main, never the PR's copy, and nothing here executes code
# from the PR. It reads evidence as data and merges through the REST API.
#
# The required check is the JOB named `land-on-evidence`, not a check run posted over the API. A
# check run posted with GITHUB_TOKEN attaches to the first workflow-run suite on the head SHA, and
# the required-check rule reads the latest one; a PR that went draft -> ready (two runs, two
# suites) then answered "Required status check is expected" and never landed. A job's own check
# run is always in its own suite. The merge is a second job that starts after the check is green.
name: land on evidence

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (empty: every open, ready PR)"
        required: false

permissions:
  contents: write        # PUT /pulls/{n}/merge, and the lock refs
  pull-requests: write
  checks: write          # land-rest only: the REST check run for dispatch / push runs

env:
  CILOCK_VERSION: 4.10.0
  CILOCK_SHA256: 639254767e8affb827a69ec753574ff991956e5388287bd1498d2fa0532c76aa
  GH_TOKEN: ${{ github.token }}   # see LAND.md: swap for a GitHub App installation token
  REPO: ${{ github.repository }}
  BASE: ${{ github.event.pull_request.base.ref || github.ref_name }}   # the branch this run lands on
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    if: ${{ contains(fromJSON(vars.LAND_BRANCHES || '["main"]'), github.event.pull_request.base.ref || github.ref_name) }}
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.plan.outputs.prs }}
    steps:
      # Trusted code: main for push and dispatch, the BASE branch for pull_request_target.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
      - name: Install cilock
        run: |
          curl -fsSLo cilock.tgz "https://cilock.dev/dl/v${CILOCK_VERSION}/cilock-${CILOCK_VERSION}-linux-amd64.tar.gz"
          echo "${CILOCK_SHA256}  cilock.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf cilock.tgz -C "$HOME/.local/bin" cilock && rm cilock.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: plan
        env:
          PR_EVENT: ${{ github.event.pull_request.number }}
          PR_INPUT: ${{ inputs.pr }}
        run: .land/plan.sh

  # ---- pull_request_target: this job IS the required check ----
  land-on-evidence:
    name: land-on-evidence
    needs: plan
    # No skipping on a missing plan: a skipped job counts as passing for a required check.
    # An absent or failed plan fails the job in the first step instead.
    if: ${{ always() && github.event_name == 'pull_request_target' && contains(fromJSON(vars.LAND_BRANCHES || '["main"]'), github.event.pull_request.base.ref || github.ref_name) }}
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
      - id: check
        env:
          PLAN: ${{ needs.plan.result }}
          PRS: ${{ needs.plan.outputs.prs }}
        run: |
          if [ "$PLAN" != success ] || [ -z "$PRS" ] || [ "$PRS" = "[]" ]; then
            echo "::error title=No landing plan::the plan job did not produce this PR (plan: $PLAN)"; exit 1
          fi
          PR=$(jq -r '.[0].pr' <<<"$PRS"); HEAD_SHA=$(jq -r '.[0].head' <<<"$PRS")
          VERIFIED=$(jq -r '.[0].verified' <<<"$PRS"); DRAFT=$(jq -r '.[0].draft' <<<"$PRS")
          MODULES=$(jq -r '.[0].modules' <<<"$PRS")
          export PR HEAD_SHA VERIFIED DRAFT MODULES
          .land/land.sh check

  merge:
    needs: [plan, land-on-evidence]
    if: ${{ needs.land-on-evidence.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
      - env:
          PRS: ${{ needs.plan.outputs.prs }}
        run: |
          PR=$(jq -r '.[0].pr' <<<"$PRS"); HEAD_SHA=$(jq -r '.[0].head' <<<"$PRS")
          export PR HEAD_SHA
          .land/land.sh merge

  # Backstop: free this run's locks even if the merge job never ran or was cancelled.
  unlock:
    needs: [plan, land-on-evidence, merge]
    if: ${{ always() && github.event_name == 'pull_request_target' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
      - env:
          PRS: ${{ needs.plan.outputs.prs }}
        run: |
          [ -n "$PRS" ] && [ "$PRS" != "[]" ] || exit 0
          PR=$(jq -r '.[0].pr' <<<"$PRS"); export PR
          .land/land.sh release

  # ---- push and workflow_dispatch: no pull_request event, so a REST check run stands in ----
  land-rest:
    needs: plan
    if: ${{ github.event_name != 'pull_request_target' && needs.plan.outputs.prs != '' && needs.plan.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.prs) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
      - env:
          PR: ${{ matrix.pr }}
          HEAD_SHA: ${{ matrix.head }}
          VERIFIED: ${{ matrix.verified }}
          DRAFT: ${{ matrix.draft }}
          MODULES: ${{ matrix.modules }}
        run: .land/land.sh all
